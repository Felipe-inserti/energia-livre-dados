[project]
name = "energia-livre-dados"
version = "0.1.0"
description = "Plataforma de dados do mercado livre de energia"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-storage>=3.1.0",
    "holidays>=0.105",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dbt = [
    "dbt-bigquery>=1.12.1",
]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
]
# Previsão mensal (Sprint 5): o que o modelo vencedor usa. É o único grupo de ML que a imagem do Airflow instala.
ml = [
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]
# Só para reproduzir a comparação do desenvolvimento (o LightGBM perdeu e não vai para a imagem).
ml-exploracao = [
    "lightgbm>=4.7.0",
]
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "nbstripout>=0.9.1",
]

[tool.uv]
# Um ambiente só: `uv sync` instala também o dbt (ver docs/decisoes.md)
default-groups = ["dev", "dbt", "notebook", "ml", "ml-exploracao"]
# Projeto de scripts, não uma biblioteca: não precisa ser construído/instalado.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: estilo, F: erros lógicos, I: ordem dos imports, B: bugs comuns, UP: sintaxe moderna
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# O notebook acerta o sys.path (para achar `notebooks.utilitarios`) antes dos imports do projeto.
"notebooks/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite `import ingestion` nos testes a partir da raiz (não usamos layout src/).
pythonpath = ["."]
