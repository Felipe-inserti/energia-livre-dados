# Projeto dbt: transforma o `raw` (STRING, como veio da fonte) em staging, intermediate e marts.
# Rodar da raiz do repositório:
#   uv run --env-file .env dbt <comando> --project-dir dbt --profiles-dir dbt
name: energia_livre
version: "0.1.0"
config-version: 2

profile: energia_livre

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Parâmetros dos marts (premissas documentadas em docs/premissas.md).
vars:
  data_inicio_dim_tempo: "2000-01-01" # a dim_tempo cobre da primeira carga do ONS (2000) até 2030,
  data_fim_dim_tempo: "2030-12-31" # o último ano do calendário de feriados do raw
  hora_ponta_inicio: 18 # primeira hora local do horário de ponta (18h)
  horas_de_ponta: 3 # a ANEEL define a ponta como 3 horas consecutivas: 18h, 19h e 20h
  limite_mudanca_estacao_m: 500 # deslocamento a partir do qual uma estação "mudou de lugar"
  # Testes de faixa e de qualidade (Sprint 3, tarefa 3.2)
  pld_tolerancia_rs: 0.01 # folga de arredondamento na comparação do PLD com piso e teto
  carga_maxima_mwmed: 100000 # teto de plausibilidade da carga horária de UM subsistema (o SE chega a 62.150)
  temperatura_minima_c: -10 # faixa plausível das 37 estações do SE/CO (observado: -4,7 a 42,7)
  temperatura_maxima_c: 46
  completude_minima_inmet: 0.95 # mesmo critério de seleção das estações (docs/fontes.md)
  # Incremental do ONS (Sprint 4). As vars da janela (utc_inicio, utc_fim, particoes_utc, raw_mes_inicio,
  # raw_mes_fim) NÃO têm padrão de propósito: vêm de `python -m ingestion.janela`, e uma execução
  # incremental sem elas falha. `fct_carga_materializacao`: table (padrão) ou incremental.
  fct_carga_materializacao: table

# Seeds: tabelas de referência versionadas (limites do PLD), no dataset `staging`.
seeds:
  energia_livre:
    +schema: staging

models:
  energia_livre:
    # Staging: tipos corretos, nomes padronizados, UTC e deduplicação. Tabela (não view):
    # uma view releria o raw inteiro (de 100 a 366 MB) a cada consulta.
    staging:
      +materialized: table
      +schema: staging

    # Intermediate: junções e agregações entre as fontes. Tabelas no dataset `staging` (só existem os
    # datasets raw, staging e marts).
    intermediate:
      +materialized: table
      +schema: staging

    # Marts: dimensões e fatos, no dataset `marts`.
    marts:
      +materialized: table
      +schema: marts
