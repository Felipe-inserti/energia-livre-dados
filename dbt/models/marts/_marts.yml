version: 2

# Dimensões (tarefa 2.3) e fatos (2.5). A dim_fonte fica fora: depende da geração por fonte, que foi
# adiada (item de corte da lista "Se atrasar"). Todas as colunas têm descrição (tarefa 2.7); as que
# se repetem usam os blocos de dbt/models/_docs.md.
models:
  - name: dim_tempo
    description: >
      Uma linha por hora UTC de 2000-01-01 00:00Z a 2030-12-31 23:00Z (271.752 linhas), com os
      atributos de calendário na hora local (America/Sao_Paulo). Feriado, dia da semana, tipo de
      dia e estação usam a DATA LOCAL. Dois conceitos de feriado: `eh_feriado` (biblioteca
      `holidays`, alimenta `tipo_dia`) e `eh_feriado_aneel` (os 11 feriados nacionais da ANEEL,
      alimenta o horário de ponta). O horário de ponta é uma premissa (18h às 20h59 locais) usada
      só na análise, não no cálculo do contrato. Nota: as 2 primeiras linhas (2000-01-01 00:00Z e
      01:00Z) têm data local de 1999-12-31, porque o horário de verão deixava o relógio local 2 horas
      atrás da UTC; a primeira carga do ONS (2000-01-01 00:00 local) é a linha das 02:00Z.
    columns:
      - name: instante_utc
        description: "Início da hora, em UTC. Chave da dimensão."
        data_tests:
          - unique
          - not_null
      - name: instante_local
        description: "O mesmo instante no relógio local (America/Sao_Paulo, com horário de verão até 2018)."
        data_tests: [not_null]
      - name: data_local
        description: "Data local do instante."
        data_tests: [not_null]
      - name: hora_local
        description: "Hora local (0 a 23)."
        data_tests: [not_null]
      - name: deslocamento_utc_horas
        description: "Diferença entre a hora local e a UTC: -3, ou -2 durante o horário de verão (até 2019-02)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [-3, -2]
                quote: false
      - name: eh_horario_verao
        description: "Verdadeiro quando o deslocamento é -2 (horário de verão)."
        data_tests: [not_null]
      - name: ano
        description: "Ano da data local."
        data_tests: [not_null]
      - name: mes
        description: "Mês da data local (1 a 12)."
        data_tests: [not_null]
      - name: dia_do_mes
        description: "Dia do mês da data local (1 a 31)."
        data_tests: [not_null]
      - name: dia_da_semana
        description: "Dia da semana ISO da data local: 1 = segunda-feira ... 7 = domingo."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false
      - name: eh_feriado
        description: >
          Feriado nacional da biblioteca `holidays` na data local (inclui a Consciência Negra desde
          2024; não inclui Carnaval nem Corpus Christi). Alimenta `tipo_dia`.
        data_tests: [not_null]
      - name: qtd_feriados
        description: "Quantos feriados caem na data local (0, 1 ou 2: em 2000-04-21 há Sexta-feira Santa e Tiradentes)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: false
      - name: nomes_feriado
        description: "Nomes dos feriados da data local, um por elemento (lista vazia se não há feriado)."
      - name: tipo_dia
        description: >
          `dia_util`, `sabado` ou `domingo_feriado`. Feriado nacional (`eh_feriado`) e domingo valem
          `domingo_feriado`, inclusive o feriado que cai num sábado (docs/premissas.md).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["dia_util", "sabado", "domingo_feriado"]
      - name: estacao_do_ano
        description: >
          Estação meteorológica do hemisfério sul, fechada por mês: verão (dez a fev), outono (mar a
          mai), inverno (jun a ago) e primavera (set a nov).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["verao", "outono", "inverno", "primavera"]
      - name: eh_feriado_aneel
        description: >
          Feriado nacional para fins de tarifa (ANEEL): 1º de janeiro, terça de Carnaval,
          Sexta-feira Santa, Tiradentes, 1º de maio, Corpus Christi, 7 de setembro, 12 de outubro,
          Finados, 15 de novembro e Natal. Não inclui a Consciência Negra.
        data_tests: [not_null]
      - name: eh_horario_ponta
        description: >
          Premissa de análise: hora local entre 18h e 20h59, de segunda a sexta, fora dos feriados
          da ANEEL. A distribuidora define as 3 horas na prática; não entra no cálculo do contrato.
        data_tests: [not_null]

  - name: dim_submercado
    description: >
      Os 4 submercados do SIN e a correspondência entre os códigos do ONS e os nomes da CCEE:
      SE/CO = `SE` (ONS) = `SUDESTE` (CCEE). A chave é o código do ONS, que é estável; o nome do ONS
      do SE mudou em 2026 (`SUDESTE` até 2025, `SUDESTE/CENTRO-OESTE` depois), por isso `nomes_ons`
      é uma lista.
    columns:
      - name: codigo_submercado
        description: "Código do ONS (`id_subsistema`): SE, S, NE ou N. Chave da dimensão."
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ["SE", "S", "NE", "N"]
      - name: nome_ccee
        description: "Nome do submercado na CCEE (`submercado`): SUDESTE, SUL, NORDESTE ou NORTE."
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ["SUDESTE", "SUL", "NORDESTE", "NORTE"]
      - name: nomes_ons
        description: "Nomes que o ONS usou (`nom_subsistema`), o mais recente primeiro."
      - name: rotulo
        description: "Rótulo curto para exibição (SE/CO, S, NE, N)."
        data_tests:
          - unique
          - not_null

  - name: dim_estacao
    description: >
      As 37 estações do INMET selecionadas (critério de 95% de horas válidas em cada ano de 2021 a
      2025), com o registro mais recente dos metadados. Os metadados mudam entre os arquivos:
      14 estações têm coordenadas diferentes entre os anos (quase sempre só precisão), e duas
      **mudaram de lugar**: A042 Brazlândia (~9,5 km em 2026) e A704 Três Lagoas (~1,3 km em 2023).
      A coluna `mudou_de_lugar` e o teste `dim_estacao_mudancas_de_lugar_esperadas` documentam isso;
      mudar de lugar quebra a continuidade da série da estação.
    columns:
      - name: estacao_codigo
        description: "Código da estação (WMO), ex.: A701. Chave da dimensão."
        data_tests:
          - unique
          - not_null
      - name: uf
        description: '{{ doc("uf") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["DF", "ES", "GO", "MG", "MS", "RJ", "SP"]
      - name: regiao
        description: "SE (ES, MG, RJ, SP) ou CO (DF, GO, MS, MT), pela UF."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["SE", "CO"]
      - name: estacao_nome
        description: "Nome no arquivo mais recente."
        data_tests: [not_null]
      - name: latitude
        description: "Latitude do registro mais recente, em graus."
        data_tests: [not_null]
      - name: longitude
        description: "Longitude do registro mais recente, em graus."
        data_tests: [not_null]
      - name: latitude_inicial
        description: "Latitude do registro mais antigo."
      - name: longitude_inicial
        description: "Longitude do registro mais antigo."
      - name: deslocamento_m
        description: "Distância em metros entre as coordenadas do registro mais antigo e do mais recente."
        data_tests: [not_null]
      - name: mudou_de_lugar
        description: "Verdadeiro se o deslocamento for de 500 m ou mais (variável `limite_mudanca_estacao_m`)."
        data_tests: [not_null]
      - name: n_nomes
        description: "Quantos nomes distintos a estação teve nos arquivos (a A521 BH Pampulha tem 2)."
      - name: primeiro_instante_utc
        description: "Primeira hora UTC em que a estação aparece nos dados do INMET carregados."
        data_tests: [not_null]
      - name: ultimo_instante_utc
        description: "Última hora UTC em que a estação aparece nos dados carregados (2026 vai até 31/08)."
        data_tests: [not_null]

  # ----------------------------------------------------------------- fatos (tarefa 2.5)
  - name: fct_carga_horaria
    description: >
      Carga horária do ONS por submercado. Grão: (submercado, hora UTC), 937.796 linhas. Particionada
      por mês em `instante_utc` e clusterizada por submercado. Os valores nulos (dias inteiros sem dado
      de 2013 a 2015) ficam: tratá-los é papel dos testes da Sprint 3.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [codigo_submercado, instante_utc]
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_ons__curva_carga')
    columns:
      - name: codigo_submercado
        description: "Código do ONS do submercado (SE, S, NE ou N). Chave estrangeira da dim_submercado."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_submercado')
                field: codigo_submercado
      - name: instante_utc
        description: "Início da hora, em UTC. Chave estrangeira da dim_tempo e coluna de partição (mensal)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: instante_utc
      - name: carga_mwmed
        description: "Carga média da hora em MWmed. Nulo nos dias inteiros sem dado de 2013 a 2015."
      - name: _carregado_em
        description: '{{ doc("carregado_em") }}'

  - name: fct_pld_horario
    description: >
      PLD horário por submercado. Grão: (submercado, hora UTC), 201.696 linhas. O submercado vem com o
      nome da CCEE e é traduzido para o código do ONS pela dim_submercado. Particionada por mês e
      clusterizada por submercado.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [codigo_submercado, instante_utc]
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_ccee__pld_horario')
    columns:
      - name: codigo_submercado
        description: "Código do ONS do submercado. Chave estrangeira da dim_submercado."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_submercado')
                field: codigo_submercado
      - name: instante_utc
        description: "Início da hora, em UTC. Chave estrangeira da dim_tempo e coluna de partição (mensal)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: instante_utc
      - name: pld_rs_mwh
        description: "PLD da hora em R$/MWh (NUMERIC)."
        data_tests: [not_null]
      - name: _carregado_em
        description: '{{ doc("carregado_em") }}'

  - name: fct_clima_horario
    description: >
      Medições horárias das 37 estações do INMET. Grão: (estação, hora UTC), 1.837.272 linhas, com as 17
      medidas. A temperatura agregada por estado e submercado fica nos modelos int_clima_*. O `uf` é
      uma cópia do atributo da dim_estacao, para clusterizar e filtrar sem junção. Particionada por mês
      e clusterizada por UF e estação.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [estacao_codigo, instante_utc]
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_inmet__estacoes_horario')
    columns:
      - name: estacao_codigo
        description: "Código da estação. Chave estrangeira da dim_estacao."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_estacao')
                field: estacao_codigo
      - name: uf
        description: "UF da estação (cópia da dim_estacao)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["DF", "ES", "GO", "MG", "MS", "RJ", "SP"]
      - name: instante_utc
        description: "Início da hora, em UTC. Chave estrangeira da dim_tempo e coluna de partição (mensal)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: instante_utc
      - name: temperatura_c
        description: "Temperatura do ar (bulbo seco), em °C. Nulo em ~1,35% das horas."
      - name: precipitacao_mm
        description: "Precipitação total da hora, em mm."
      - name: pressao_mb
        description: "Pressão atmosférica ao nível da estação na hora, em milibar (mB)."
      - name: pressao_max_mb
        description: "Pressão atmosférica máxima na hora anterior, em mB (medida automática)."
      - name: pressao_min_mb
        description: "Pressão atmosférica mínima na hora anterior, em mB (medida automática)."
      - name: radiacao_kj_m2
        description: "Radiação global da hora, em kJ/m². Nula à noite e quando o sensor falha."
      - name: temperatura_orvalho_c
        description: '{{ doc("inmet_temperatura_orvalho") }}'
      - name: temperatura_max_c
        description: "Temperatura máxima na hora anterior, em °C (medida automática)."
      - name: temperatura_min_c
        description: "Temperatura mínima na hora anterior, em °C (medida automática)."
      - name: temperatura_orvalho_max_c
        description: "Temperatura de orvalho máxima na hora anterior, em °C."
      - name: temperatura_orvalho_min_c
        description: "Temperatura de orvalho mínima na hora anterior, em °C."
      - name: umidade_max_pct
        description: "Umidade relativa máxima na hora anterior, em %."
      - name: umidade_min_pct
        description: "Umidade relativa mínima na hora anterior, em %."
      - name: umidade_pct
        description: "Umidade relativa do ar na hora, em %."
      - name: vento_direcao_graus
        description: "Direção do vento na hora, em graus (0 a 360, a origem do vento)."
      - name: vento_rajada_ms
        description: "Rajada máxima de vento na hora, em m/s."
      - name: vento_velocidade_ms
        description: "Velocidade do vento na hora, em m/s."
      - name: _carregado_em
        description: '{{ doc("carregado_em") }}'

  - name: fct_pld_semanal
    description: >
      PLD histórico semanal por patamar (2001-2020). Grão: (submercado, semana, ordem do preço), 3
      linhas por semana, 12.312 linhas, sem partição. Tem o fim de cada semana e as horas reais dela
      (com o horário de verão). O patamar não é identificável. Serve ao preço de contrato de 2021.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [codigo_submercado, inicio_semana_utc, ordem_preco_na_semana]
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_ccee__pld_semanal')
    columns:
      - name: codigo_submercado
        description: '{{ doc("codigo_submercado") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_submercado')
                field: codigo_submercado
      - name: inicio_semana_utc
        description: "Início da semana operativa (00:00 local do primeiro dia), em UTC."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: instante_utc
      - name: fim_semana_utc
        description: "Início da semana seguinte (a última semana dura 7 dias)."
        data_tests: [not_null]
      - name: horas_na_semana
        description: "Horas reais entre o início e o fim da semana (167 ou 169 nas semanas com mudança de horário de verão)."
        data_tests: [not_null]
      - name: pld_rs_mwh
        description: "PLD do patamar em R$/MWh (NUMERIC)."
        data_tests: [not_null]
      - name: data_inicio_semana
        description: '{{ doc("data_inicio_semana") }}'
      - name: ordem_preco_na_semana
        description: '{{ doc("ordem_preco_na_semana") }}'

  - name: fct_submercado_horario
    description: >
      Carga, PLD e temperatura na mesma granularidade: uma linha por (submercado, hora UTC), com junção
      completa das três fontes (a carga vai de 2000 a out/2026; PLD e clima, de 2021 em diante). Onde
      uma fonte não tem a linha, a coluna é nula. Particionada por mês e clusterizada por submercado.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [codigo_submercado, instante_utc]
    columns:
      - name: codigo_submercado
        description: '{{ doc("codigo_submercado") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_submercado')
                field: codigo_submercado
      - name: instante_utc
        description: '{{ doc("instante_utc") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: instante_utc
      - name: carga_mwmed
        description: '{{ doc("carga_mwmed") }}'
      - name: pld_rs_mwh
        description: "PLD da hora em R$/MWh (NUMERIC). Nulo antes de 2021 (a série horária da CCEE começa em 2021)."
      - name: temperatura_c
        description: "Temperatura média do submercado na hora, em °C (só o SE; nula para os demais e antes de 2021)."

  # ----------------------------------------------------------------- série mensal (Sprint 4, Parte B)
  - name: fct_carga_mensal
    description: >
      Carga mensal por submercado em MWmed, com a série ORIGINAL do ONS e uma série AJUSTADA para uma
      definição só (carga bruta: com usinas não despachadas e com MMGD). Grão: (submercado, mês
      local). Sem partição (tabela pequena). A curva do ONS mudou de definição em 01/03/2021 (tipo
      III) e em 01/05/2023 (MMGD); o ajuste usa a API de Carga Verificada (seed
      `ajuste_definicao_carga`) e a série original fica sempre ao lado. O mês corrente vem marcado
      como incompleto e não deve ser usado como alvo nem como treino. Detalhes no cabeçalho do SQL.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [codigo_submercado, mes]
    columns:
      - name: codigo_submercado
        description: '{{ doc("codigo_submercado") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_submercado')
                field: codigo_submercado
      - name: mes
        description: "Primeiro dia do mês, na data local (America/Sao_Paulo)."
        data_tests: [not_null]
      - name: horas_esperadas
        description: >
          Horas que o mês tem NO RELÓGIO LOCAL (como o ONS publica: 24 valores por dia local; 23 no dia
          em que o relógio pula uma hora; 24, e não 25, no fim do horário de verão). Horas locais
          distintas da dim_tempo.
        data_tests: [not_null]
      - name: horas_com_linha
        description: "Horas do mês que existem na `fct_carga_horaria` (valor nulo ou não). Fica abaixo de `horas_esperadas` quando o ONS não publicou o dia (N em 2014-02 e 2015-04)."
        data_tests: [not_null]
      - name: horas_validas
        description: "Horas do mês com carga não nula. A média usa só essas."
        data_tests: [not_null]
      - name: mes_incompleto
        description: >
          Verdadeiro só para o mês corrente (data de São Paulo na hora do `dbt run`): o mês ainda não
          terminou. Definido pela data, não pela contagem de horas. Nunca use o mês como alvo nem
          como treino. Mês passado com lacuna NÃO é incompleto: veja `cobertura`.
        data_tests: [not_null]
      - name: cobertura
        description: >
          Horas válidas / horas esperadas do mês (de 0 a 1). Meses com lacuna conhecida: 2013-12,
          2014-02 e 2015-04 (cobertura de 96,4% a 96,8%; docs/fontes.md). No mês corrente é a fração
          já publicada.
        data_tests: [not_null]
      - name: cobertura_suficiente
        description: "Verdadeiro quando `cobertura` >= var `cobertura_minima` (0,95)."
        data_tests: [not_null]
      - name: mes_utilizavel
        description: >
          Mês fechado com cobertura suficiente: o filtro que a previsão deve usar para alvo e treino.
        data_tests: [not_null]
      - name: carga_original_mwmed
        description: >
          Média das horas válidas da curva do ONS, em MWmed, SEM ajuste. Muda de definição em
          2021-03 e em 2023-05. Nula só se o mês não tiver nenhuma hora válida.
      - name: ajuste_tipo3_mwmed
        description: >
          MWmed somados para incluir as usinas não despachadas (tipo III): carga líquida da API menos a
          curva. Medido de 2018-01 a 2021-02 e, depois da quebra, enquanto a diferença for maior que o
          ruído (`medido_transicao`); zero depois, porque a curva já as traz; nulo antes de 2018, onde
          não há medida e o ajuste não é inventado.
      - name: ajuste_tipo3_status
        description: "medido, medido_transicao, incorporado_na_curva ou nao_disponivel (antes de 2018-01)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [medido, medido_transicao, incorporado_na_curva, nao_disponivel]
      - name: ajuste_tipo3_limiar_mwmed
        description: >
          Limiar de ruído do submercado em MWmed: `ruido_k_tipo3` x desvio-padrão da diferença mensal
          (API líquida - curva) em 2022. A transição dura enquanto |diferença| for maior que ele.
          Igual em todas as linhas do submercado.
      - name: ajuste_tipo3_fim_transicao
        description: >
          Primeiro mês, depois de 2021-03, cuja diferença cabe no ruído: dele em diante o ajuste de
          tipo III é zero. Se nenhum mês coubesse, valeria a quebra da MMGD (e um teste falha).
          Igual em todas as linhas do submercado.
      - name: ajuste_mmgd_mwmed
        description: >
          MWmed somados para incluir a MMGD: `r` x MMGD da API de 2019-02 a 2023-04; zero antes de
          2019-02 (premissa: a API não tem e a MMGD era < 0,5% da carga) e a partir de 2023-05 (a curva
          já a traz).
      - name: ajuste_mmgd_status
        description: "zero_por_premissa, medido_parcial, medido ou incorporado_na_curva."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [zero_por_premissa, medido_parcial, medido, incorporado_na_curva]
      - name: ajuste_mmgd_fator_r
        description: >
          Fração da MMGD da API que a curva traz: soma(curva - líquida da API) / soma(MMGD da API) nos
          12 meses seguintes à quebra de 2023, por submercado. Igual em todas as linhas do submercado.
      - name: carga_ajustada_mwmed
        description: >
          Carga bruta consistente em MWmed: original + tipo III + MMGD. Nula onde algum componente é
          `nao_disponivel` (antes de 2018). Onde os dois ajustes são zero (a partir de 2023-05), é
          igual à original.
      - name: carga_ajustada_r1_mwmed
        description: >
          Sensibilidade da série ajustada: igual à `carga_ajustada_mwmed`, mas com a MMGD da API
          inteira (r = 1) em vez de `r` x MMGD. Mostra quanto o resultado depende da calibração de `r`.
